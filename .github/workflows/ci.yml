name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: syntax and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check every script
        run: |
          for f in core/*.cjs adapters/vscode/*.cjs tools/*.cjs test/*.cjs; do
            node --check "$f" || exit 1
          done

      - name: Syntax check the installer
        run: bash -n install.sh

      - name: Core must not depend on any adapter
        run: |
          if grep -rn "adapters/" core/ ; then
            echo "::error::core/ must not reference an adapter."
            exit 1
          fi

      - name: Fail if a real API key is committed
        run: |
          if grep -rInE 'sk-or-v1-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
               --exclude-dir=.git --exclude-dir=node_modules .; then
            echo "::error::A credential-looking string is committed."
            exit 1
          fi

      - name: Fail if a local home path is committed
        run: |
          if grep -rInE '/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/' \
               --exclude-dir=.git --exclude-dir=node_modules \
               --exclude-dir=test .; then
            echo "::error::A local machine path is committed."
            exit 1
          fi

      - name: Fail if .env is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env must never be committed."
            exit 1
          fi

  install-smoke:
    name: fresh install actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The unit tests run from the repo tree, so they cannot catch a file that
      # install.sh forgets to copy. That is exactly how core/extract.cjs came to
      # require tools/verdict-check.cjs while the installer shipped without it:
      # every hook threw MODULE_NOT_FOUND, the adapters swallowed it and emitted
      # {}, and extraction silently did nothing on a fresh clone.
      #
      # So: install into a temp dir, then run a real hook from there.
      - name: Install into a temp directory
        run: |
          TMPD="$(mktemp -d)"
          echo "TMPD=$TMPD" >> "$GITHUB_ENV"
          LEDGER_NONINTERACTIVE=1 ./install.sh \
            --hooks-dir "$TMPD/hooks" \
            --config "$TMPD/ledger.json" \
            --instructions-dir "$TMPD/instructions" \
            --key test-key-not-real \
            --provider openrouter

      - name: Every core require resolves in the installed tree
        run: |
          cd "$TMPD/hooks"
          for f in core/*.cjs adapters/vscode/*.cjs tools/*.cjs; do
            node -e "require('./$f')" 2>&1 | grep -q "Cannot find module" \
              && { echo "::error::$f has an unresolved require after install"; exit 1; }
          done
          echo "all requires resolve"

      - name: A hook runs without crashing
        run: |
          cd "$TMPD/hooks"
          OUT="$(echo '{"session_id":"ci-smoke","prompt":"Fix the login bug and tell me the deploy command?"}' \
            | LEDGER_DIR="$TMPD/hooks/.ledger" \
              LEDGER_ENV_FILE="$TMPD/hooks/.env" \
              LEDGER_TRACE=0 \
              node adapters/vscode/prompt-submitted.cjs 2>&1)"
          echo "hook output: $OUT"
          if printf '%s' "$OUT" | grep -qiE "Cannot find module|Error:"; then
            echo "::error::the prompt hook crashed on a fresh install"
            exit 1
          fi

      - name: The hook actually persisted a ledger
        run: |
          ls "$TMPD/hooks/.ledger/"*.json >/dev/null 2>&1 \
            || { echo "::error::no ledger written — extraction did not run"; exit 1; }
          echo "ledger written"

      - name: Config points at the installed scripts
        run: |
          grep -q "$TMPD/hooks/adapters/vscode/session.cjs" "$TMPD/ledger.json" \
            || { echo "::error::config does not reference the install dir (--hooks-dir ignored)"; exit 1; }
          echo "config paths correct"

      - name: Uninstall refuses to delete dangerous paths
        run: |
          for bad in "$HOME" / /tmp; do
            if ./install.sh --uninstall --hooks-dir "$bad" 2>&1 | grep -q "refusing to remove"; then
              echo "guarded: $bad"
            else
              echo "::error::uninstall did not refuse $bad"
              exit 1
            fi
          done
